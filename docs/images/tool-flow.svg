<text x="755.2" y="124" fill="#1c1917" font-family="Georgia, serif" font-size="15">The result</text>
<text x="755.2" y="140" fill="#57534e" font-family="Arial,Helvetica,sans-serif" font-size="11">A file, still local</text>
